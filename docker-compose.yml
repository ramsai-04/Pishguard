services:
  db:
    image: postgres:16-alpine
    container_name: phishguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: phishguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phishguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: phishguard-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      PYTHON_BIN: python3
      DATABASE_URL: postgresql://postgres:postgres@db:5432/phishguard
      DIRECT_URL: postgresql://postgres:postgres@db:5432/phishguard
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000
        VITE_FIREBASE_API_KEY: AIzaSyDDSD5EfJTS55DdpURV6oivzw3Srjd1mis
        VITE_FIREBASE_AUTH_DOMAIN: phishguard-auth-81eac.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: phishguard-auth-81eac
        VITE_FIREBASE_APP_ID: 898492005439:web:1b11f2d6a0c8857dd80c8a
        # VITE_API_BASE_URL:http://localhost:4000
        # VITE_FIREBASE_API_KEY=AIzaSyDDSD5EfJTS55DdpURV6oivzw3Srjd1mis
        # VITE_FIREBASE_AUTH_DOMAIN=phishguard-auth-81eac.firebaseapp.com
        # VITE_FIREBASE_PROJECT_ID=phishguard-auth-81eac
        # VITE_FIREBASE_APP_ID=1:898492005439:web:1b11f2d6a0c8857dd80c8a 
    container_name: phishguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  postgres_data:
